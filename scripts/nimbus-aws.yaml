# CloudFormation template for a student-friendly AWS networking lab.
# This environment creates public app and private database subnets in two AZs,
# then deploys Nimbus on EC2 with a private PostgreSQL RDS database.

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Create a VPC, public and private subnets, an internet gateway, a private PostgreSQL
  database, and an EC2 instance that deploys the Nimbus Streamlit app.

Parameters:
  GitHubRepoUrl:
    Type: String
    Description: Git repository URL for the Nimbus app to clone onto the EC2 instance.
    Default: https://github.com/zihaow17/nimbus-app-ds600g5.git
    AllowedPattern: ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?$

  AllowedClientCidr:
    Type: String
    Description: CIDR allowed to reach SSH and Streamlit, e.g. your public IPv4 address with /32.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI from the public SSM parameter.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 Key Pair to use for SSH access.
    Default: vockey

Resources:
  # ---------------------------------------------------------------------------
  # VPC and networking foundation
  # ---------------------------------------------------------------------------
  NimbusVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: lab-vpc

  NimbusInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: lab-igw

  NimbusInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref NimbusVpc
      InternetGatewayId: !Ref NimbusInternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs us-east-1]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: lab-subnet-public1-us-east-1a

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs us-east-1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: lab-subnet-private1-us-east-1a

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs us-east-1]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: lab-subnet-public2

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs us-east-1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: lab-subnet-private2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NimbusVpc
      Tags:
        - Key: Name
          Value: lab-rtb-public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: NimbusInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref NimbusInternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NimbusVpc
      Tags:
        - Key: Name
          Value: lab-rtb-private1-us-east-1a

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------------------------
  # Security groups
  # ---------------------------------------------------------------------------
  NimbusWebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: Nimbus Web Security Group
      GroupDescription: Enable HTTP and Streamlit access
      VpcId: !Ref NimbusVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedClientCidr
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          CidrIp: !Ref AllowedClientCidr
          Description: Streamlit app access on port 8501
      Tags:
        - Key: Name
          Value: Nimbus Web Security Group

  NimbusDatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access from the Nimbus EC2 app only
      VpcId: !Ref NimbusVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref NimbusWebSecurityGroup
          Description: PostgreSQL from Nimbus web server
      Tags:
        - Key: Name
          Value: Nimbus Database Security Group

  NimbusDatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Nimbus PostgreSQL
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: Nimbus Database Subnets

  NimbusDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Master credentials for Nimbus PostgreSQL
      GenerateSecretString:
        SecretStringTemplate: '{"username":"nimbus_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: Nimbus Database Credentials

  NimbusDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: nimbus
      MasterUsername: !Sub '{{resolve:secretsmanager:${NimbusDatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${NimbusDatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref NimbusDatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt NimbusDatabaseSecurityGroup.GroupId
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Name
          Value: Nimbus PostgreSQL Database

  NimbusEc2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadNimbusDatabaseSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref NimbusDatabaseSecret

  NimbusInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref NimbusEc2Role

  # ---------------------------------------------------------------------------
  # EC2 instance for the app
  # ---------------------------------------------------------------------------
  NimbusWebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet2
      IamInstanceProfile: !Ref NimbusInstanceProfile
      SecurityGroupIds:
        - !Ref NimbusWebSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux

          # Amazon Linux 2023 compatibility: yum is usually available as a compatibility
          # alias, but dnf is the native package manager. This makes the bootstrap robust.
          yum install -y git python3.11 || dnf install -y git python3.11

          # Use an explicit Python version so the app does not depend on the AMI's
          # default python3 interpreter.
          python3.11 -m ensurepip --upgrade

          # Prepare the app directory and clone the project repository.
          mkdir -p /home/ec2-user/app
          chown -R ec2-user:ec2-user /home/ec2-user

          sudo -u ec2-user bash -lc 'cd /home/ec2-user && if [ ! -d /home/ec2-user/nimbus-app ]; then git clone "${GitHubRepoUrl}" /home/ec2-user/nimbus-app; fi'

          sudo -u ec2-user bash -lc '
            set -eux
            cd /home/ec2-user/nimbus-app
            python3.11 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          '

          cat >/etc/systemd/system/nimbus.service <<'EOF'
          [Unit]
          Description=Nimbus Streamlit application
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/home/ec2-user/nimbus-app
          Environment="NIMBUS_DB_HOST=${NimbusDatabase.Endpoint.Address}"
          Environment="NIMBUS_DB_PORT=${NimbusDatabase.Endpoint.Port}"
          Environment="NIMBUS_DB_NAME=nimbus"
          Environment="NIMBUS_DB_SECRET_ARN=${NimbusDatabaseSecret}"
          Environment="NIMBUS_AWS_REGION=${AWS::Region}"
          ExecStart=/home/ec2-user/nimbus-app/.venv/bin/python -m streamlit run src/app.py --server.address 0.0.0.0 --server.port 8501
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now nimbus.service
      Tags:
        - Key: Name
          Value: Web Server 1

Outputs:
  VpcId:
    Description: Created VPC ID
    Value: !Ref NimbusVpc

  WebServerPublicDns:
    Description: EC2 public DNS name for the Nimbus web app
    Value: !GetAtt NimbusWebServer.PublicDnsName

  StreamlitUrl:
    Description: URL for the deployed Streamlit app
    Value: !Sub http://${NimbusWebServer.PublicDnsName}:8501

  DatabaseEndpoint:
    Description: Private PostgreSQL endpoint for the Nimbus app
    Value: !GetAtt NimbusDatabase.Endpoint.Address

  DatabasePort:
    Description: PostgreSQL port
    Value: !GetAtt NimbusDatabase.Endpoint.Port
