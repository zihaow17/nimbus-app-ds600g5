# CloudFormation template for a student-friendly AWS networking lab.
# The template creates a multi-AZ ALB and Auto Scaling app tier, redundant NAT
# Gateways, and a Multi-AZ private MySQL RDS database.

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Create a VPC, public and private subnets, an internet gateway, NAT Gateways,
  an internet-facing load balancer, an Auto Scaling Nimbus app tier, and private
  MySQL RDS.

Parameters:
  GitHubRepoUrl:
    Type: String
    Description: Git repository URL for the Nimbus app to clone onto the EC2 instance.
    Default: https://github.com/zihaow17/nimbus-app-ds600g5.git
    AllowedPattern: ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?$

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI from the public SSM parameter.

  DatabaseMasterUsername:
    Type: String
    Default: main
    AllowedPattern: ^[A-Za-z][A-Za-z0-9_]{0,15}$
    Description: MySQL administrator and application username for this demo.

  DatabaseMasterPassword:
    Type: String
    Default: password
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: '^[A-Za-z0-9]{8,41}$'
    Description: MySQL administrator and application password; use alphanumeric characters only.

Resources:
  # ---------------------------------------------------------------------------
  # VPC and networking foundation
  # ---------------------------------------------------------------------------
  NimbusVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: lab-vpc

  NimbusInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: lab-igw

  NimbusInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref NimbusVpc
      InternetGatewayId: !Ref NimbusInternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs us-east-1]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: lab-subnet-public1-us-east-1a

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs us-east-1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: lab-subnet-private1-us-east-1a

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs us-east-1]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: lab-subnet-public2

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs us-east-1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: lab-subnet-private2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NimbusVpc
      Tags:
        - Key: Name
          Value: lab-rtb-public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: NimbusInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref NimbusInternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NimbusNatEip:
    Type: AWS::EC2::EIP
    DependsOn: NimbusInternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: Nimbus NAT Gateway EIP

  NimbusNatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn:
      - PublicRoute
      - PublicSubnet1RouteTableAssociation
    Properties:
      AllocationId: !GetAtt NimbusNatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: Nimbus NAT Gateway AZ 1

  NimbusNatEip2:
    Type: AWS::EC2::EIP
    DependsOn: NimbusInternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: Nimbus NAT Gateway EIP AZ 2

  NimbusNatGateway2:
    Type: AWS::EC2::NatGateway
    DependsOn:
      - PublicRoute
      - PublicSubnet2RouteTableAssociation
    Properties:
      AllocationId: !GetAtt NimbusNatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: Nimbus NAT Gateway AZ 2

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NimbusVpc
      Tags:
        - Key: Name
          Value: Nimbus Private Route Table AZ 1

  PrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NimbusNatGateway

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NimbusVpc
      Tags:
        - Key: Name
          Value: Nimbus Private Route Table AZ 2

  PrivateRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NimbusNatGateway2

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # ---------------------------------------------------------------------------
  # Load balancer and application security groups
  # ---------------------------------------------------------------------------
  NimbusLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public IPv4 HTTP access to Nimbus
      VpcId: !Ref NimbusVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public IPv4 HTTP access to Nimbus through the load balancer
      Tags:
        - Key: Name
          Value: Nimbus Load Balancer Security Group

  NimbusWebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: Nimbus Web Security Group
      GroupDescription: Enable HTTP and Streamlit access
      VpcId: !Ref NimbusVpc
      Tags:
        - Key: Name
          Value: Nimbus Web Security Group

  NimbusWebFromLoadBalancerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt NimbusWebSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8501
      ToPort: 8501
      SourceSecurityGroupId: !GetAtt NimbusLoadBalancerSecurityGroup.GroupId
      Description: Streamlit traffic from the Nimbus load balancer

  NimbusDatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL access from the Nimbus EC2 app only
      VpcId: !Ref NimbusVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref NimbusWebSecurityGroup
          Description: MySQL from Nimbus web server
      Tags:
        - Key: Name
          Value: Nimbus Database Security Group

  NimbusDatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Nimbus MySQL
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: Nimbus Database Subnets

  NimbusTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref NimbusVpc
      TargetType: instance
      Protocol: HTTP
      Port: 8501
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      Matcher:
        HttpCode: '200-399'
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: '86400'
      Tags:
        - Key: Name
          Value: Nimbus App Targets

  NimbusLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn:
      - PublicRoute
      - PublicSubnet1RouteTableAssociation
      - PublicSubnet2RouteTableAssociation
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !GetAtt NimbusLoadBalancerSecurityGroup.GroupId
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '300'
      Tags:
        - Key: Name
          Value: Nimbus Application Load Balancer

  NimbusHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NimbusLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NimbusTargetGroup

  NimbusDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: false
      DBName: nimbus
      MasterUsername: !Ref DatabaseMasterUsername
      MasterUserPassword: !Ref DatabaseMasterPassword
      DBSubnetGroupName: !Ref NimbusDatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt NimbusDatabaseSecurityGroup.GroupId
      PubliclyAccessible: false
      MultiAZ: true
      BackupRetentionPeriod: 0
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Name
          Value: Nimbus MySQL Database

  # ---------------------------------------------------------------------------
  # Auto Scaling app tier
  # ---------------------------------------------------------------------------
  NimbusLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t2.micro
        SecurityGroupIds:
          - !Ref NimbusWebSecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eu

            yum install -y git python3.11 || dnf install -y git python3.11
            python3.11 -m ensurepip --upgrade

            mkdir -p /home/ec2-user/app
            chown -R ec2-user:ec2-user /home/ec2-user

            sudo -u ec2-user bash -lc 'cd /home/ec2-user && if [ ! -d /home/ec2-user/nimbus-app ]; then git clone "${GitHubRepoUrl}" /home/ec2-user/nimbus-app; fi'

            sudo -u ec2-user bash -lc '
              set -eux
              cd /home/ec2-user/nimbus-app
              python3.11 -m venv .venv
              . .venv/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            '

            install -d -m 0700 /etc/nimbus
            cat >/etc/nimbus/nimbus.env <<'EOF'
            NIMBUS_DB_HOST=${NimbusDatabase.Endpoint.Address}
            NIMBUS_DB_PORT=${NimbusDatabase.Endpoint.Port}
            NIMBUS_DB_NAME=nimbus
            NIMBUS_DB_USER=${DatabaseMasterUsername}
            NIMBUS_DB_PASSWORD=${DatabaseMasterPassword}
            NIMBUS_DB_SSL_CA=/etc/pki/tls/certs/rds-global-bundle.pem
            EOF
            chmod 0600 /etc/nimbus/nimbus.env

            cat >/etc/systemd/system/nimbus.service <<'EOF'
            [Unit]
            Description=Nimbus Streamlit application
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=ec2-user
            WorkingDirectory=/home/ec2-user/nimbus-app
            EnvironmentFile=/etc/nimbus/nimbus.env
            ExecStart=/home/ec2-user/nimbus-app/.venv/bin/python -m streamlit run src/app.py --server.address 0.0.0.0 --server.port 8501
            Restart=on-failure
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            EOF

            curl -fsSLo /etc/pki/tls/certs/rds-global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
            chmod 0644 /etc/pki/tls/certs/rds-global-bundle.pem
            systemctl daemon-reload
            systemctl enable --now nimbus.service

  NimbusAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - NimbusHttpListener
      - PrivateRoute1
      - PrivateRoute2
      - PrivateSubnet1RouteTableAssociation
      - PrivateSubnet2RouteTableAssociation
    Properties:
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref NimbusLaunchTemplate
        Version: !GetAtt NimbusLaunchTemplate.LatestVersionNumber
      MinSize: '2'
      DesiredCapacity: '2'
      MaxSize: '6'
      HealthCheckType: ELB
      HealthCheckGracePeriod: 900
      TargetGroupARNs:
        - !Ref NimbusTargetGroup
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - Key: Name
          Value: Nimbus App Instance
          PropagateAtLaunch: true

  NimbusCpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref NimbusAutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 300
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60.0

Outputs:
  VpcId:
    Description: Created VPC ID
    Value: !Ref NimbusVpc

  LoadBalancerDns:
    Description: Public DNS name for the Nimbus Application Load Balancer
    Value: !GetAtt NimbusLoadBalancer.DNSName

  StreamlitUrl:
    Description: HTTP URL for the Nimbus app through the load balancer
    Value: !Sub http://${NimbusLoadBalancer.DNSName}

  DatabaseEndpoint:
    Description: Private MySQL endpoint for the Nimbus app
    Value: !GetAtt NimbusDatabase.Endpoint.Address

  DatabasePort:
    Description: MySQL port
    Value: !GetAtt NimbusDatabase.Endpoint.Port
