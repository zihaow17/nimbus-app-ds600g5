# CloudFormation template for a student-friendly AWS networking lab.
# This environment creates a VPC, public/private subnets in two AZs, routing,
# a security group, and an EC2 instance that deploys the Nimbus Streamlit app.
# The app is configured to run on port 8501 and is reachable from the internet.

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Create a VPC, subnets, security group, internet gateway, NAT gateway, and an EC2
  instance that clones the Nimbus app repository, installs dependencies in a Python
  virtual environment, and runs the app on port 8501.

Parameters:
  GitHubRepoUrl:
    Type: String
    Description: Git repository URL for the Nimbus app to clone onto the EC2 instance.
    Default: https://github.com/zihaow17/nimbus-app-ds600g5.git

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 Key Pair to use for SSH access.
    Default: vockey

Resources:
  # ---------------------------------------------------------------------------
  # VPC and networking foundation
  # ---------------------------------------------------------------------------
  NimbusVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: lab-vpc

  NimbusInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: lab-igw

  NimbusInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref NimbusVpc
      InternetGatewayId: !Ref NimbusInternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs us-east-1]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: lab-subnet-public1-us-east-1a

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs us-east-1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: lab-subnet-private1-us-east-1a

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs us-east-1]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: lab-subnet-public2

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs us-east-1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: lab-subnet-private2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NimbusVpc
      Tags:
        - Key: Name
          Value: lab-rtb-public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: NimbusInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref NimbusInternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NimbusVpc
      Tags:
        - Key: Name
          Value: lab-rtb-private1-us-east-1a

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: NimbusInternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: lab-eip-nat-public1-us-east-1a

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: NimbusInternetGatewayAttachment
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: lab-nat-public1-us-east-1a

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------------------------
  # Security groups
  # ---------------------------------------------------------------------------
  NimbusWebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: Nimbus Web Security Group
      GroupDescription: Enable HTTP and Streamlit access
      VpcId: !Ref NimbusVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          CidrIp: 0.0.0.0/0
          Description: Streamlit app access on port 8501
      Tags:
        - Key: Name
          Value: Nimbus Web Security Group

  # ---------------------------------------------------------------------------
  # EC2 instance for the app
  # ---------------------------------------------------------------------------
  NimbusWebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0fef201115eefe936
      InstanceType: t2.micro
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet2
      SecurityGroupIds:
        - !Ref NimbusWebSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux

          # Amazon Linux 2023 compatibility: yum is usually available as a compatibility
          # alias, but dnf is the native package manager. This makes the bootstrap robust.
          yum install -y git python3 python3-pip || dnf install -y git python3 python3-pip

          # Python 3 venv support is usually handled by ensurepip, which works on AL2023
          # without requiring a separate python3-venv package.
          python3 -m ensurepip --upgrade

          # Prepare the app directory and clone the project repository.
          mkdir -p /home/ec2-user/app
          chown -R ec2-user:ec2-user /home/ec2-user

          sudo -u ec2-user bash -lc 'cd /home/ec2-user && if [ ! -d /home/ec2-user/nimbus-app ]; then git clone ${GitHubRepoUrl} /home/ec2-user/nimbus-app; fi'

          sudo -u ec2-user bash -lc '
            set -eux
            cd /home/ec2-user/nimbus-app
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            nohup python -m streamlit run src/app.py --server.address 0.0.0.0 --server.port 8501 >/tmp/nimbus-streamlit.log 2>&1 &
          '
      Tags:
        - Key: Name
          Value: Web Server 1

Outputs:
  VpcId:
    Description: Created VPC ID
    Value: !Ref NimbusVpc

  WebServerPublicDns:
    Description: EC2 public DNS name for the Nimbus web app
    Value: !GetAtt NimbusWebServer.PublicDnsName

  StreamlitUrl:
    Description: URL for the deployed Streamlit app
    Value: !Sub http://${NimbusWebServer.PublicDnsName}:8501
